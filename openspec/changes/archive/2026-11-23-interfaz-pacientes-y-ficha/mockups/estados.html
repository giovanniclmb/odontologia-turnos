<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Estados de carga y error</title>
  <link rel="stylesheet" href="../../../../../design-system/tokens.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Navegación principal">
      <div class="brand">
        <img src="../../../../../design-system/assets/logo.svg" alt="Logo provisional (TBD)" />
        <span class="brand-name" data-brand-name></span>
      </div>
      <nav class="nav" aria-label="Secciones">
        <a href="./pacientes-lista.html">Pacientes</a>
        <a href="#">Agenda</a>
        <a href="#">Ficha clínica</a>
        <a href="#">Lista de espera</a>
        <a href="#">Configuración</a>
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <span class="topbar-title">Estados</span>
        <span style="font-size: var(--text-sm); color: var(--color-text-muted);">UI states</span>
      </header>

      <main class="content">
        <section class="page-header">
          <div>
            <h1>Estados de la interfaz</h1>
            <p>Loading, error y empty.</p>
          </div>
        </section>

        <section class="card">
          <div class="card-title" style="margin-bottom: var(--space-3);">Cargando</div>
          <p style="color: var(--color-text-muted);">Obteniendo pacientes…</p>
          <button class="btn btn-primary" disabled aria-busy="true">Cargando…</button>
        </section>

        <section class="card">
          <div class="card-title" style="margin-bottom: var(--space-3);">Error de carga</div>
          <div class="alert alert-danger" role="alert">
            <span aria-hidden="true">✕</span>
            <div><strong>No se pudieron cargar los datos.</strong> Reintente.</div>
          </div>
          <button class="btn btn-secondary" style="margin-top: var(--space-3);">Reintentar</button>
        </section>

        <section class="card">
          <div class="empty">
            <div class="empty-icon" aria-hidden="true">∅</div>
            <div class="empty-title">Sin pacientes</div>
            <div class="empty-text">Todavía no hay pacientes registrados.</div>
            <div style="margin-top: var(--space-4);">
              <a class="btn btn-primary" href="./paciente-alta.html">Nuevo paciente</a>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../../../../../design-system/brand.js" defer></script>
</body>
</html>
