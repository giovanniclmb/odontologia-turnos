<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — Consultorio odontológico</title>
  <link rel="stylesheet" href="../../../../design-system/tokens.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main style="min-height: 100vh; display: grid; place-items: center; padding: var(--space-6); background: var(--color-bg);">
    <section class="card" style="width: 100%; max-width: 24rem;" aria-labelledby="login-title">
      <div style="display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4);">
        <img src="../../../../design-system/assets/logo.svg" alt="Logo provisional (TBD)" height="32" />
        <div>
          <div class="brand-name" data-brand-name></div>
          <div style="font-size: var(--text-xs); color: var(--color-text-subtle);">Acceso al sistema</div>
        </div>
      </div>
      <h1 id="login-title" style="font-size: var(--text-lg); margin-bottom: var(--space-4);">Iniciar sesión</h1>

      <form style="display: flex; flex-direction: column; gap: var(--space-4);">
        <div class="field">
          <label for="usuario">Usuario</label>
          <input id="usuario" class="input" type="text" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="clave">Contraseña</label>
          <input id="clave" class="input" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Ingresar</button>
      </form>

      <p style="font-size: var(--text-xs); color: var(--color-text-subtle); margin-top: var(--space-4);">
        El sistema emite un token opaco; no usa cookies. <span class="tbd">TBD: política de expiración</span>
      </p>
    </section>
  </main>

  <!-- Estado de rechazo genérico -->
  <main style="min-height: 100vh; display: grid; place-items: center; padding: var(--space-6); background: var(--color-bg);">
    <section class="card" style="width: 100%; max-width: 24rem;" aria-labelledby="login-err-title">
      <h1 id="login-err-title" style="font-size: var(--text-lg); margin-bottom: var(--space-4);">Iniciar sesión</h1>
      <div class="alert alert-danger" role="alert" style="margin-bottom: var(--space-4);">
        <span aria-hidden="true">✕</span>
        <div><strong>Acceso denegado.</strong> Verifique sus credenciales.</div>
      </div>
      <form style="display: flex; flex-direction: column; gap: var(--space-4);">
        <div class="field">
          <label for="usuario2">Usuario</label>
          <input id="usuario2" class="input" type="text" />
        </div>
        <div class="field">
          <label for="clave2">Contraseña</label>
          <input id="clave2" class="input is-error" type="password" aria-describedby="clave-err" />
          <span id="clave-err" class="error">Credenciales inválidas.</span>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Ingresar</button>
      </form>
      <p style="font-size: var(--text-xs); color: var(--color-text-subtle); margin-top: var(--space-4);">
        Mensaje genérico: no revela si el usuario existe. No se conserva token.
      </p>
    </section>
  </main>

  <script src="../../../../design-system/brand.js" defer></script>
</body>
</html>
