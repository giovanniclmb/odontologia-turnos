name: Asignar Issues del roadmap

"on":
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Simular sin modificar Issues
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: assign-roadmap
  cancel-in-progress: false

jobs:
  assign:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Obtener el reparto aprobado
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verificar el asignador
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Asignar únicamente Issues pendientes
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 scripts/assign_roadmap.py
          else
            python3 scripts/assign_roadmap.py --apply
          fi
